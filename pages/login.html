<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">

        <a class="navbar-brand" href="../index.html">
            <img src="../images/logo.png" alt="" width="30" height="30" class="d-inline-block align-text-top">
      <a class="navbar-brand fw-bold" href="../" id="navbar-brand">E -Jewelleries </a>
    
      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#home">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">GemCraft</a>
          </li>   
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Gold
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Ring</a></li>
              <li><a class="dropdown-item" href="#">Bangles</a></li>
              <li><a class="dropdown-item" href="#">Earrings</a></li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="true">
              Silver
            </a>

              <li><a class="dropdown-item" href="#">Ring</a></li>
              <li><a class="dropdown-item" href="#">Bangles</a></li>
              <li><a class="dropdown-item" href="#">Earrings</a></li>
              <li><a class="dropdown-item" href="#">Necklaces</a></li>
            
            </ul>
          </li>
        </ul>
        
      </div>
    </div>
  </nav>

  <div class="container mt-5 mb-5" data-aos="fade-up" data-aos-duration="1000">
    <div class="row justify-content-center">
      <div class="col-md-12 col-lg-10">
        <div class="card shadow-lg border-0 rounded-4" style="max-width: 800px; margin: auto;">
          <div class="card-body p-4">
    <div class="row justify-content-center">
      <div class="col-md-12 col-lg-10">
        <div class="card shadow-lg border-0 rounded-4" style="max-width: 800px; margin: auto;">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Login for E-Jewelleries</h3>
  
            <form class="needs-validation" novalidate>
              
  
              <!-- Username -->
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-user-circle"></i></span>
                <input type="text" class="form-control" id="username" required placeholder="Username">
                <div class="invalid-feedback">Username is required.</div>
              </div>
  
              <!-- Password -->
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" required placeholder="Password">
                <div class="invalid-feedback">Password is required.</div>
              </div>
  
              
  
              <!-- Submit -->
              <div class="submit-button text-center">
                <button type="reset" class="btn btn-secondary px-4 me-2">Reset</button>
                
                <button type="submit" class="btn btn-warning px-4">Login</button>
              </div>
            </form>
  
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap validation script -->
  <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
  
  
      
      

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 

    <!-- AOS Animation JS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init();
</script>

    
</body>
